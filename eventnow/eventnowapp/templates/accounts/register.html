<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — EventNow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Inter"', '-apple-system', 'BlinkMacSystemFont', '"Helvetica Neue"', 'sans-serif'] },
          colors: {
            primary: '#0071e3',
            'primary-dark': '#0058b3',
            ink: '#1d1d1f',
            'ink-2': '#6e6e73',
            'ink-3': '#aeaeb2',
            surface: '#f5f5f7',
            card: '#ffffff',
            border: '#d2d2d7',
            success: '#34c759',
            warning: '#ff9500',
            danger: '#ff3b30',
          },
        }
      }
    }
  </script>
  <style>* { -webkit-font-smoothing: antialiased; }</style>
</head>
<body class="bg-surface text-ink font-sans min-h-screen flex flex-col">

  <!-- Minimal header -->
  <header class="bg-white/80 backdrop-blur-xl border-b border-border">
    <div class="max-w-5xl mx-auto px-6 h-14 flex items-center justify-between">
      <a href="{% url 'index' %}" class="text-base font-semibold text-ink tracking-tight">EventNow</a>
      <a href="{% url 'index' %}" class="flex items-center gap-1.5 text-sm text-ink-2 hover:text-ink transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
        Back
      </a>
    </div>
  </header>

  <main class="flex-1 flex items-center justify-center px-6 py-16">
    <div class="w-full max-w-sm">

      <!-- Role tabs -->
      <div class="flex gap-1 p-1 bg-surface rounded-xl mb-6 border border-border" role="tablist" aria-label="Account type">
        <button id="tab-attendee" role="tab" aria-selected="true" aria-controls="panel-attendee"
          class="flex-1 text-sm font-medium py-2 rounded-lg bg-card text-ink shadow-sm transition-all">
          Attendee
        </button>
        <button id="tab-organiser" role="tab" aria-selected="false" aria-controls="panel-organiser"
          class="flex-1 text-sm font-medium py-2 rounded-lg text-ink-2 hover:text-ink transition-all">
          Organiser
        </button>
      </div>

      <!-- ── ATTENDEE PANEL ── -->
      <div id="panel-attendee" role="tabpanel" aria-labelledby="tab-attendee">

        <!-- Register form -->
        <div id="attendee-register">
          <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-ink tracking-tight mb-1">Create account</h1>
            <p class="text-sm text-ink-2">Register as an attendee</p>
          </div>
          <form action="#" method="post" class="space-y-3" novalidate>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label for="att-reg-first" class="block text-xs font-medium text-ink mb-1.5">First name</label>
                <input id="att-reg-first" type="text" autocomplete="given-name" required placeholder="Samuel"
                  class="w-full px-4 py-3 text-sm border border-border rounded-xl bg-card text-ink placeholder-ink-3 focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary transition-colors">
              </div>
              <div>
                <label for="att-reg-last" class="block text-xs font-medium text-ink mb-1.5">Last name</label>
                <input id="att-reg-last" type="text" autocomplete="family-name" required placeholder="Kaloh"
                  class="w-full px-4 py-3 text-sm border border-border rounded-xl bg-card text-ink placeholder-ink-3 focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary transition-colors">
              </div>
            </div>
            <div>
              <label for="att-reg-email" class="block text-xs font-medium text-ink mb-1.5">Email</label>
              <input id="att-reg-email" type="email" autocomplete="email" required placeholder="you@example.com"
                class="w-full px-4 py-3 text-sm border border-border rounded-xl bg-card text-ink placeholder-ink-3 focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary transition-colors">
            </div>
            <div>
              <label for="att-reg-password" class="block text-xs font-medium text-ink mb-1.5">Password</label>
              <input id="att-reg-password" type="password" autocomplete="new-password" required placeholder="At least 8 characters"
                class="w-full px-4 py-3 text-sm border border-border rounded-xl bg-card text-ink placeholder-ink-3 focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary transition-colors">
            </div>
            <button type="submit" class="w-full bg-primary text-white text-sm font-medium py-3 rounded-full hover:bg-primary-dark transition-colors mt-1">Create account</button>
          </form>
          <p class="text-center text-xs text-ink-2 mt-5">
            Already have an account?
            <a href="{% url 'login' %}"><button class="text-primary font-medium hover:underline ml-0.5">Sign in</button></a>
          </p>
        </div>

      </div>

      <!-- ── ORGANISER PANEL ── -->
      <div id="panel-organiser" role="tabpanel" aria-labelledby="tab-organiser" class="hidden">

        <!-- Register form -->
        <div id="organiser-register">
          <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-ink tracking-tight mb-1">Create organiser account</h1>
            <p class="text-sm text-ink-2">Start hosting events today</p>
          </div>
          <form action="#" method="post" class="space-y-3" novalidate>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label for="org-reg-first" class="block text-xs font-medium text-ink mb-1.5">First name</label>
                <input id="org-reg-first" type="text" autocomplete="given-name" required
                  class="w-full px-4 py-3 text-sm border border-border rounded-xl bg-card text-ink placeholder-ink-3 focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary transition-colors">
              </div>
              <div>
                <label for="org-reg-last" class="block text-xs font-medium text-ink mb-1.5">Last name</label>
                <input id="org-reg-last" type="text" autocomplete="family-name" required
                  class="w-full px-4 py-3 text-sm border border-border rounded-xl bg-card text-ink placeholder-ink-3 focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary transition-colors">
              </div>
            </div>
            <div>
              <label for="org-reg-org" class="block text-xs font-medium text-ink mb-1.5">Organisation name</label>
              <input id="org-reg-org" type="text" autocomplete="organization" required placeholder="TechConnect AU"
                class="w-full px-4 py-3 text-sm border border-border rounded-xl bg-card text-ink placeholder-ink-3 focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary transition-colors">
            </div>
            <div>
              <label for="org-reg-email" class="block text-xs font-medium text-ink mb-1.5">Work email</label>
              <input id="org-reg-email" type="email" autocomplete="email" required
                class="w-full px-4 py-3 text-sm border border-border rounded-xl bg-card text-ink placeholder-ink-3 focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary transition-colors">
            </div>
            <div>
              <label for="org-reg-password" class="block text-xs font-medium text-ink mb-1.5">Password</label>
              <input id="org-reg-password" type="password" autocomplete="new-password" required placeholder="At least 8 characters"
                class="w-full px-4 py-3 text-sm border border-border rounded-xl bg-card text-ink placeholder-ink-3 focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary transition-colors">
            </div>
            <div>
              <label for="org-reg-plan" class="block text-xs font-medium text-ink mb-1.5">Plan</label>
              <select id="org-reg-plan" class="w-full px-4 py-3 text-sm border border-border rounded-xl bg-card text-ink focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary transition-colors cursor-pointer">
                <option value="starter">Starter — Free</option>
                <option value="pro">Pro — $29/mo</option>
                <option value="enterprise">Enterprise — $99/mo</option>
              </select>
            </div>
            <button type="submit" class="w-full bg-primary text-white text-sm font-medium py-3 rounded-full hover:bg-primary-dark transition-colors mt-1">Create account</button>
          </form>
          <p class="text-center text-xs text-ink-2 mt-5">
            Already have an account?
            <a href="{% url 'login' %}"><button class="text-primary font-medium hover:underline ml-0.5">Sign in</button></a>
          </p>
        </div>

      </div>

      <!-- Terms -->
      <p class="text-center text-xs text-ink-3 mt-8 leading-relaxed">
        By continuing, you agree to our
        <a href="#" class="text-ink-2 hover:text-ink transition-colors">Terms of Service</a>
        and
        <a href="#" class="text-ink-2 hover:text-ink transition-colors">Privacy Policy</a>.
      </p>
    </div>
  </main>

  <script>
    // Role tab switching
    const roleTabs = [
      { tab: document.getElementById('tab-attendee'), panel: document.getElementById('panel-attendee') },
      { tab: document.getElementById('tab-organiser'), panel: document.getElementById('panel-organiser') },
    ];
    roleTabs.forEach(({ tab }, i) => {
      tab.addEventListener('click', () => {
        roleTabs.forEach(({ tab: t, panel: p }, j) => {
          const active = i === j;
          t.setAttribute('aria-selected', String(active));
          t.className = active
            ? 'flex-1 text-sm font-medium py-2 rounded-lg bg-card text-ink shadow-sm transition-all'
            : 'flex-1 text-sm font-medium py-2 rounded-lg text-ink-2 hover:text-ink transition-all';
          p.classList.toggle('hidden', !active);
        });
      });
    });

    // Attendee login/register toggle
    // document.getElementById('show-att-register').addEventListener('click', () => {
    //   document.getElementById('attendee-login').classList.add('hidden');
    //   document.getElementById('attendee-register').classList.remove('hidden');
    // });
    // document.getElementById('show-att-login').addEventListener('click', () => {
    //   document.getElementById('attendee-register').classList.add('hidden');
    //   document.getElementById('attendee-login').classList.remove('hidden');
    // });

    // Organiser login/register toggle
    // document.getElementById('show-org-register').addEventListener('click', () => {
    //   document.getElementById('organiser-login').classList.add('hidden');
    //   document.getElementById('organiser-register').classList.remove('hidden');
    // });
    // document.getElementById('show-org-login').addEventListener('click', () => {
    //   document.getElementById('organiser-register').classList.add('hidden');
    //   document.getElementById('organiser-login').classList.remove('hidden');
    // });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}EventNow{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Inter"', '-apple-system', 'BlinkMacSystemFont', '"Helvetica Neue"', 'sans-serif'] },
          colors: {
            primary: '#0071e3',
            'primary-dark': '#0058b3',
            ink: '#1d1d1f',
            'ink-2': '#6e6e73',
            'ink-3': '#aeaeb2',
            surface: '#f5f5f7',
            card: '#ffffff',
            border: '#d2d2d7',
            success: '#34c759',
            warning: '#ff9500',
            danger: '#ff3b30',
          },
        }
      }
    }
  </script>
  <style>* { -webkit-font-smoothing: antialiased; }</style>
  {% block extra_head %}{% endblock %}
</head>
<body class="{% block body_class %}bg-surface text-ink font-sans{% endblock %}">

  <!-- Skip-to-main: required for accessibility rubric -->
  <a href="#main"
     class="sr-only focus:not-sr-only focus:fixed focus:top-4 focus:left-4 focus:z-50 focus:bg-primary focus:text-white focus:px-4 focus:py-2 focus:rounded-lg text-sm font-medium">
    Skip to main content
  </a>

  <!-- Role-aware navbar — each page overrides this block -->
  {% block header %}{% endblock %}

  <!-- Main content — pages with non-standard layouts (e.g. sidebar) override block body instead -->
  {% block body %}
    <main id="main">
      {% block content %}{% endblock %}
    </main>
  {% endblock %}

  <!-- Footer — opt-in per page -->
  {% block footer %}{% endblock %}

  <!-- Page-specific scripts -->
  {% block scripts %}{% endblock %}

</body>
</html>
